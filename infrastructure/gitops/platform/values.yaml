# Platform addon defaults.
#
# These are COMMITTED on purpose — ArgoCD reads them from git. They are safe:
# no secrets, no account-specific values. Override anything here from your own
# gitignored infrastructure/gitops/values.yaml (Terraform injects it into the
# root Application as inline values) — see ../README.md.

# Where the platform manifests are read from. Overridden by Terraform with the
# repo/revision you configured, so a fork works without editing this file.
repo:
  url: https://github.com/elamaran11/agent-sandbox-blueprints
  revision: main

# ArgoCD destination cluster NAME.
#
# EKS Managed ArgoCD runs its control plane OUTSIDE the cluster and registers the
# cluster by name, explicitly disabling the in-cluster address. An Application
# using `destination.server: https://kubernetes.default.svc` is rejected with
#   cluster "https://kubernetes.default.svc" is disabled
# so every Application here targets `destination.name` instead. Terraform
# overrides this with the real cluster name.
destinationCluster: agent-sandbox-eks

# ── Agent Sandbox (required) ───────────────────────────────────────────────────
# The Sandbox / SandboxClaim / SandboxTemplate CRDs + operator. BOTH substrates
# depend on these, so this is not optional.
agentSandbox:
  enabled: true
  namespace: agent-sandbox-system
  # Vendored upstream release manifests, pinned for reproducibility.
  path: infrastructure/gitops/platform/vendor/agent-sandbox
  version: v0.5.1

# ── Argo Workflows (required) ─────────────────────────────────────────────────
# The engine the Dark Factory pipeline runs on.
argoWorkflows:
  enabled: true
  namespace: argo
  chart:
    repoURL: https://argoproj.github.io/argo-helm
    name: argo-workflows
    version: "0.45.24"
  # Workflows are submitted by the Argo Events sensor, so the server is only for
  # humans watching runs. Left cluster-internal; port-forward to view it.
  server:
    authMode: server

# ── Argo Events (required) ────────────────────────────────────────────────────
# Turns the GitHub webhook into a workflow submission.
argoEvents:
  enabled: true
  namespace: argo-events
  chart:
    repoURL: https://argoproj.github.io/argo-helm
    name: argo-events
    version: "2.4.15"

# ── Karpenter — REQUIRED for the Kata substrate ───────────────────────────────
# Not optional if you want Kata: nested-virt nodes are provisioned by Karpenter
# NodePools, and without the controller the kata/nodepools Application cannot
# create a single object. Terraform builds all of Karpenter's AWS-side plumbing;
# this installs the controller that uses it.
karpenter:
  enabled: true
  # 1.13.0 is a FLOOR: EC2NodeClass spec.cpuOptions.nestedVirtualization was added
  # in 1.13 (aws/karpenter-provider-aws#9043) and Kata cannot boot without it.
  chart:
    repoURL: public.ecr.aws/karpenter
    name: karpenter
    version: "1.13.0"
  replicas: 2
  # Label on the managed node group. Karpenter must not run on nodes it manages.
  nodeRole: system

# ── Bifrost — in-cluster LLM gateway (optional) ───────────────────────────────
# The Kata agent calls models through this so requests can be traced centrally.
# The Lambda MicroVM agent bypasses it (it runs outside the cluster network and
# calls Bedrock directly), so turning this off only affects the Kata path's
# observability, not whether it works.
bifrost:
  enabled: true
  namespace: bifrost
  # Must match llm_gateway_namespace / llm_gateway_service_account in
  # infrastructure/terraform — that is what the Bedrock Pod Identity binds to.
  serviceAccount: bifrost
  # The Kata agent reaches the gateway here, by ClusterIP (a Kata guest cannot
  # resolve cluster service DNS).
  port: 8080
  # The upstream chart has NO default image tag and fails to render without one.
  # Must be a real tag from hub.docker.com/r/maximhq/bifrost/tags.
  imageTag: "v1.5.0"
  chart:
    repoURL: https://maximhq.github.io/bifrost/helm-charts
    name: bifrost
    # Pinned: Bifrost releases frequently, and an unpinned version means two people
    # running this blueprint a month apart get different gateways.
    version: "2.1.16"

# ── OpenTelemetry collector (optional) ────────────────────────────────────────
otelCollector:
  enabled: false
  namespace: otel

# ── Langfuse — LLM tracing UI (optional) ──────────────────────────────────────
# Nice for a demo (you can watch the agent's reasoning), not required.
langfuse:
  enabled: false
  namespace: langfuse
