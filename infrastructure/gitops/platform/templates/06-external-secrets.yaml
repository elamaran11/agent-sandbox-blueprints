{{- if .Values.externalSecrets.enabled }}
{{- /*
External Secrets Operator — how the GitHub PAT gets into the cluster without ever
being in git.

WHY THIS IS NOT OPTIONAL IN PRACTICE: the examples already ship three
ExternalSecret objects (one per namespace that needs the token, each mapping to
that namespace's expected key name). Without this operator installed, `task demo`
fails outright with

  no matches for kind "ExternalSecret" in version "external-secrets.io/v1"
  ensure CRDs are installed first

so the pipeline could not be deployed at all. Set enabled=false only if you intend
to create the Secrets by hand (see examples/_shared/SECRETS.md) AND also set
github.externalSecret.enabled=false in the example values, or you get the error
above.

THE SECRET FLOW, and what is and is not automated:

  you, once  ──▶  AWS Secrets Manager (dark-factory/github)
                     │  ClusterSecretStore + Pod Identity (no static keys)
                     ▼
                  ExternalSecret ×3  ──▶  k8s Secret in argo / argo-events /
                                          agent-sandbox-system
                     │
                     ▼
                  mounted 0400 into the sandbox at /etc/secrets/gh-token

A credential has to enter the system somewhere — that is irreducible. What IS
automated is everything after: distribution to three namespaces under three
different key names, refresh on rotation (refreshInterval), and recreation on a
cluster rebuild. Git and values carry only the REFERENCE (secret id + key names),
never the value.

Pinned: 2.9.0 serves external-secrets.io/v1, which is the API the example
templates use. Older 0.x charts served only v1beta1 and would not match.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Wave 1: the CRDs must exist before any ExternalSecret is applied.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.externalSecrets.chart.repoURL | quote }}
    chart: {{ .Values.externalSecrets.chart.name | quote }}
    targetRevision: {{ .Values.externalSecrets.chart.version | quote }}
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        serviceAccount:
          create: true
          # Credentials come from EKS Pod Identity (see storage of the same pattern
          # in terraform), so no IRSA annotation is needed here.
          name: {{ .Values.externalSecrets.serviceAccount }}
        # A demo does not need the webhook/cert-controller HA footprint.
        replicaCount: 1
  destination:
    name: {{ .Values.destinationCluster | quote }}
    namespace: {{ .Values.externalSecrets.namespace }}
  syncPolicy:
    automated:
      # prune: false — pruning these CRDs would delete every ExternalSecret and,
      # with creationPolicy: Owner, the Secrets they own along with them.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ESO CRDs are large enough to exceed the client-side apply annotation
      # limit, same as the agent-sandbox CRDs.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
{{- end }}
