{{- if .Values.bifrost.enabled }}
{{- /*
Bifrost — in-cluster LLM gateway (OPTIONAL).

Why it exists here: the Kata agent runs inside the cluster, so it can route model
calls through a gateway. That buys centralized tracing (Langfuse) and one place
to swap models — a materially better demo, since you can watch the agent think.

Why it is optional: the Lambda MicroVM agent CANNOT use it. That sandbox runs
outside the cluster network entirely, so it calls Bedrock directly with its own
execution role. Turning Bifrost off therefore costs the Kata path its tracing;
it does not stop either substrate from working.

Credentials: no API keys here. The gateway's ServiceAccount is bound to a Bedrock
role via EKS Pod Identity in infrastructure/terraform/iam.tf — keep
.Values.bifrost.serviceAccount in sync with llm_gateway_service_account there.

Sourced from the UPSTREAM chart, not a local path. This previously pointed at
infrastructure/gitops/platform/addons/bifrost, which does not exist in this repo —
ArgoCD failed with "app path does not exist" and the Application never synced. The
OAP equivalent is an umbrella chart adding a Crossplane IAM Role and an
ExternalSecret; neither Crossplane nor External Secrets is part of this blueprint,
and Terraform already creates the Bedrock role + Pod Identity association, so
there is nothing left to wrap.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bifrost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.bifrost.chart.repoURL | quote }}
    chart: {{ .Values.bifrost.chart.name | quote }}
    targetRevision: {{ .Values.bifrost.chart.version | quote }}
    helm:
      releaseName: bifrost
      valuesObject:
        image:
          # REQUIRED by the upstream chart — it has no default and fails the render
          # with "ERROR: image.tag is required" rather than picking appVersion.
          tag: {{ .Values.bifrost.imageTag | quote }}
          pullPolicy: IfNotPresent
        serviceAccount:
          create: true
          # MUST match llm_gateway_service_account in terraform: the Pod Identity
          # association is keyed on (namespace, serviceAccount), so a different
          # name here means the gateway starts fine and then gets AccessDenied
          # from Bedrock — which looks like a model problem, not a naming one.
          name: {{ .Values.bifrost.serviceAccount | quote }}
        service:
          # ClusterIP on purpose. The Kata agent reaches this by IP rather than DNS,
          # because a Kata guest's resolver cannot resolve cluster service names.
          type: ClusterIP
          port: {{ .Values.bifrost.port | default 8080 }}
  # Bifrost is a StatefulSet, and spec.volumeClaimTemplates is IMMUTABLE. The API
  # server defaults fields inside it that are not in the chart's output — an
  # embedded apiVersion/kind, volumeMode: Filesystem, and a status block — so the
  # live object never matches the manifest. ArgoCD cannot patch an immutable field,
  # so without this the Application sits OutOfSync forever while being perfectly
  # Healthy, which reads like a broken deploy and trains people to ignore status.
  #
  # Verified this is only server-side defaulting: diffing the rendered
  # volumeClaimTemplates against the live one shows no config difference.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: bifrost
      namespace: {{ .Values.bifrost.namespace }}
      jsonPointers:
        - /spec/volumeClaimTemplates
  destination:
    name: {{ .Values.destinationCluster | quote }}
    namespace: {{ .Values.bifrost.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
{{- end }}
