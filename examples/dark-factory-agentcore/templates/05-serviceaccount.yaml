# EKS Pod Identity allows one association per ServiceAccount. The shared workflow
# SA can already have Lambda's association, so only AgentCore invoke/stop pods use
# this dedicated SA. The substrate chart supplies its invoker role association.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.agentcore.invokerServiceAccount }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
---
# The Argo executor in invoke/stop pods must publish workflowtaskresults too.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dark-factory-agentcore-workflow
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.agentcore.invokerServiceAccount }}
    namespace: {{ .Values.argo.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dark-factory-workflow
---
# Invoke/stop read the runtime handoff from this one platform-owned sandbox.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dark-factory-agentcore-sandbox
  namespace: {{ .Values.agentcore.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kro.run"]
    resources: ["agentcoresandboxes"]
    resourceNames: [{{ .Values.agentcore.sandboxName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dark-factory-agentcore-sandbox
  namespace: {{ .Values.agentcore.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.agentcore.invokerServiceAccount }}
    namespace: {{ .Values.argo.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dark-factory-agentcore-sandbox
