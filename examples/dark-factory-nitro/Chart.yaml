apiVersion: v2
name: dark-factory-nitro
description: >-
  Dark Factory pipeline on the Nitro Sandbox substrate (EKS Pod Isolation,
  preview). Turns a labeled GitHub issue into a reviewed, merged pull request
  written by an agent inside its own Nitro-isolated microVM.
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  # Everything the substrates share (sensor, RBAC, iterate/merge templates,
  # scripts, holdout) lives in one place so the examples cannot drift.
  - name: dark-factory-shared
    version: 0.1.0
    repository: "file://../_shared"
