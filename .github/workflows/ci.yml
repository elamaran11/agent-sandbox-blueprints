# Static checks only — no AWS credentials, nothing deployed.
#
# What this can catch: terraform that does not parse or is unformatted, charts that
# stop rendering, a credential or one deployment's account IDs getting committed.
#
# What it cannot catch: anything requiring a cluster. Whether Karpenter provisions a
# nested-virt node, whether a pod boots under kata-clh, whether a Microvm reaches
# RUNNING — all of that needs a real account and is verified by hand (see
# docs/TROUBLESHOOTING.md). Do not read a green check here as "the blueprint works".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lint:leaks and lint:secrets scan `git ls-files`, so the checkout must be
          # a real repo (it is) — but they only look at the current tree, not history.
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
          task --version

      - name: terraform fmt + validate
        run: task lint:tf

      - name: No credentials committed
        run: task lint:secrets

      - name: No account or cluster identifiers committed
        run: task lint:leaks

      - name: Every chart renders
        run: task lint:render

  # Each example carries a copy of the shared values tree; keep the copies in
  # sync on the keys they share. Logic lives in scripts/check-values-sync.sh so
  # `task lint:values` runs the same check locally.
  values-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships mikefarah yq v4 today; pin our own copy so a runner
      # image change cannot turn this job into a silent no-op.
      - uses: mikefarah/yq@v4.52.4
      - name: examples/*/defaults.yaml match examples/_shared/values.yaml
        run: |
          yq --version
          scripts/check-values-sync.sh
