{{- if .Values.agentcore.enabled }}
{{- $a := .Values.agentcore }}
{{- if not (regexMatch "^[0-9]{12}$" ($a.accountId | toString)) }}{{ fail "agentcore.accountId must be a 12-digit account ID" }}{{- end }}
{{- if not (regexMatch "@sha256:[0-9a-f]{64}$" $a.image.uri) }}{{ fail "agentcore.image.uri must end in @sha256:<64 lowercase hex digits>" }}{{- end }}
{{- if not (has $a.network.mode (list "PUBLIC" "VPC")) }}{{ fail "agentcore.network.mode must be PUBLIC or VPC" }}{{- end }}
{{- if and (eq $a.network.mode "VPC") (or (lt (len $a.network.subnets) 1) (lt (len $a.network.securityGroups) 1)) }}{{ fail "VPC mode requires agentcore.network.subnets and securityGroups" }}{{- end }}
{{- if not (regexMatch "^[a-z]([a-z0-9-]*[a-z0-9])?$" $a.podIdentity.clusterName) }}{{ fail "agentcore.podIdentity.clusterName must be a DNS-1123 label (lowercase letters, digits, hyphens; start with a letter)" }}{{- end }}
{{- if gt (len $a.podIdentity.clusterName) 33 }}{{ fail "agentcore.podIdentity.clusterName must be at most 33 characters: the -dark-factory-agentcore-invoker IAM role suffix must fit 64 characters" }}{{- end }}
{{/*
  AgentCoreSandbox is platform-owned: one runtime + execution role per cluster.
  ACK's AgentRuntime spec lacks platformVersion, so the Taskfile sets V2 via
  update-agent-runtime after READY; never put it into this resource's spec.
  Managed KRO only watches kro.run. The ACK CRD status paths below are checked
  against bedrockagentcorecontrol v1.15.1's AgentRuntime CRD.
*/}}
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: agentcore-sandbox
  labels:
    {{- include "agentcore.labels" . | nindent 4 }}
  annotations:
    # RGD before the instance: KRO has to register its generated CRD first.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  schema:
    apiVersion: v1alpha1
    kind: AgentCoreSandbox
    group: kro.run
    spec:
      # Raw DNS-safe cluster name. Used for Kubernetes metadata.name and the
      # execution IAM role name; hyphens are valid in both, not in AgentCore.
      name: string | required=true
      # AgentCore agentRuntimeName only: underscores replace hyphens and the
      # _dark_factory suffix fits its 48-character limit. Never use for K8s names.
      runtimeName: string | required=true
      # Needed for the execution role's aws:SourceAccount trust condition.
      accountId: string | required=true
      image:
        uri: string | required=true
      region: string | default="{{ $a.region }}"
      network:
        mode: string | default="PUBLIC" enum="PUBLIC,VPC"
        subnets: "[]string | default=[]"
        securityGroups: "[]string | default=[]"
      lifecycle:
        idleRuntimeSessionTimeout: integer | default=900
        maxLifetime: integer | default=28800
    status:
      runtimeARN: ${agentRuntime.status.ackResourceMetadata.arn}
      runtimeID: ${agentRuntime.status.agentRuntimeID}
      runtimeStatus: ${agentRuntime.status.status}
      # Nothing reads this, but KRO refuses to update a generated CRD when a status
      # property is removed ("breaking changes detected: Property executionRoleARN
      # was removed") and leaves the graph Inactive. Removing it means recreating
      # the CRD, which deletes the instance and orphans the runtime. Keep it.
      executionRoleARN: ${execRole.status.ackResourceMetadata.arn}
  resources:
    # The runtime assumes this role to pull ECR, call Bedrock and write logs.
    - id: execRole
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          name: ${schema.spec.name}-agentcore-exec
        spec:
          name: ${schema.spec.name}-agentcore-exec
          assumeRolePolicyDocument: |
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"bedrock-agentcore.amazonaws.com"},"Action":"sts:AssumeRole","Condition":{"StringEquals":{"aws:SourceAccount":"${schema.spec.accountId}"}}}]}
          inlinePolicies:
            agentcore-exec: |
              {"Version":"2012-10-17","Statement":[
                {"Effect":"Allow","Action":["bedrock:InvokeModel","bedrock:InvokeModelWithResponseStream","bedrock:Converse","bedrock:ConverseStream"],"Resource":["arn:aws:bedrock:*::foundation-model/*","arn:aws:bedrock:*:*:inference-profile/*"]},
                {"Effect":"Allow","Action":"ecr:GetAuthorizationToken","Resource":"*"},
                {"Effect":"Allow","Action":["ecr:BatchGetImage","ecr:GetDownloadUrlForLayer"],"Resource":"arn:aws:ecr:${schema.spec.region}:${schema.spec.accountId}:repository/*"},
                {"Effect":"Allow","Action":["logs:CreateLogGroup","logs:CreateLogStream","logs:PutLogEvents"],"Resource":"arn:aws:logs:${schema.spec.region}:${schema.spec.accountId}:log-group:/aws/bedrock-agentcore/runtimes/*"}
              ]}
    # A single runtime avoids status references to skipped conditional children.
    # KRO supports standalone CEL objects: the ternary returns the entire network
    # configuration. PUBLIC has NO networkModeConfig key; VPC includes the IDs.
    # We do not use omit(), which is feature-gated on some KRO installations.
     # KRO reserves the id `runtime`.
    - id: agentRuntime
      template:
        apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
        kind: AgentRuntime
        metadata:
          name: ${schema.spec.name}-agentcore-runtime
        spec:
          agentRuntimeName: ${schema.spec.runtimeName}
          description: Dark Factory coder runtime
          agentRuntimeArtifact:
            containerConfiguration:
              containerURI: ${schema.spec.image.uri}
          roleARN: ${execRole.status.ackResourceMetadata.arn}
          networkConfiguration: >-
            ${schema.spec.network.mode == "VPC" ? {"networkMode": "VPC", "networkModeConfig": {"subnets": schema.spec.network.subnets, "securityGroups": schema.spec.network.securityGroups}} : {"networkMode": "PUBLIC"}}
          protocolConfiguration:
            serverProtocol: HTTP
          lifecycleConfiguration:
            idleRuntimeSessionTimeout: ${schema.spec.lifecycle.idleRuntimeSessionTimeout}
            maxLifetime: ${schema.spec.lifecycle.maxLifetime}
---
# ONE platform instance. Run sessions are disposable and created through Invoke,
# not through AgentRuntimeEndpoint or separate Kubernetes objects.
apiVersion: kro.run/v1alpha1
kind: AgentCoreSandbox
metadata:
  name: {{ $a.sandbox.name }}
  namespace: {{ include "agentcore.namespace" . }}
  labels:
    {{- include "agentcore.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  name: {{ $a.podIdentity.clusterName }}
  runtimeName: {{ regexReplaceAll "-" $a.podIdentity.clusterName "_" }}_dark_factory
  accountId: {{ $a.accountId | quote }}
  image:
    uri: {{ $a.image.uri | quote }}
  region: {{ $a.region | quote }}
  network:
    mode: {{ $a.network.mode | quote }}
    subnets: {{ $a.network.subnets | toJson }}
    securityGroups: {{ $a.network.securityGroups | toJson }}
  lifecycle:
    idleRuntimeSessionTimeout: {{ $a.lifecycle.idleRuntimeSessionTimeout }}
    maxLifetime: {{ $a.lifecycle.maxLifetime }}
{{- end }}
