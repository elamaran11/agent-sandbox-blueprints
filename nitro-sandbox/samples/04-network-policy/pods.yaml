# Two sandboxes: a server, and a client that plays the agent.
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: nitro-demo
  labels:
    app: server
spec:
  runtimeClassName: isolated-sandbox
  terminationGracePeriodSeconds: 0
  enableServiceLinks: false
  containers:
    - name: http
      image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
      args: ["netexec", "--http-port=8080"]
      ports:
        - containerPort: 8080
      readinessProbe:
        tcpSocket:
          port: 8080
        periodSeconds: 2
      resources:
        requests:
          cpu: 250m
          memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: nitro-demo
spec:
  selector:
    app: server
  ports:
    - port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: agent
  namespace: nitro-demo
  labels:
    app: agent
spec:
  runtimeClassName: isolated-sandbox
  terminationGracePeriodSeconds: 0
  enableServiceLinks: false
  containers:
    - name: main
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 250m
          memory: 768Mi
