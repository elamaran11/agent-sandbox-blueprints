{{- /*
The Kata coder SandboxTemplate — the Flow A substrate Flow B actually claims from.

Without this (and the warm pool next to it) `task demo-kata` creates a SandboxClaim
against warmPoolRef: coder-warmpool and nothing binds it: the run hangs at the claim
step with no pod and no error, because a claim cannot materialise a bare template.

The isolation story: the coder executes untrusted, model-generated code, so it runs
in a Kata micro-VM (hardware-virtualised guest kernel), carries no cloud credentials,
reaches models only through Bifrost, and gets its two secrets as 0400 read-only
mounts. Compare lambda-microvm's bridge template, which DOES hold AWS credentials
because RunMicrovm is an imperative API call — there the VM boundary is remote.
*/ -}}
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ .Values.warmPool.templateName }}
  namespace: {{ include "kata-sandbox.namespace" . }}
  labels:
    {{- include "kata-sandbox.labels" . | nindent 4 }}
spec:
  # Flow B injects DF_ISSUE_NUMBER / DF_REPO / DF_BRANCH / CODER_ENGINE / BIFROST_URL
  # into the `coder` container via SandboxClaim.spec.env. Without this policy the
  # operator rejects the claim (failureCondition EnvVarsInjectionRejected in df-run).
  envVarsInjectionPolicy: {{ .Values.coderTemplate.envVarsInjectionPolicy | default "Allowed" }}
  podTemplate:
    metadata:
      labels:
        {{- include "kata-sandbox.selectorLabels" . | nindent 8 }}
        agent-sandbox.io/role: coder
        agent-sandbox.io/substrate: kata
    spec:
      # This is the whole point of the substrate: the pod runs as a micro-VM with its
      # own kernel, not as a namespaced process on the host. nodeSelector and
      # tolerations are deliberately absent — the RuntimeClass carries them and the
      # admission controller merges them in (see values.yaml).
      runtimeClassName: {{ .Values.coderTemplate.runtimeClassName | default "kata-clh" }}

      # No API access. The coder never talks to Kubernetes; df-run polls GitHub for
      # its result. A token here would be a credential inside untrusted-code territory.
      automountServiceAccountToken: false

      restartPolicy: Never

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        # MUST be named `coder`: SandboxClaim.spec.env targets containerName: coder,
        # and the operator rejects the claim with "target container coder not found"
        # if it differs. Both substrates expose this name so df-run is substrate-blind.
        - name: coder
          image: {{ include "kata-sandbox.coderImage" . }}
          imagePullPolicy: IfNotPresent
          # The image's CMD (node entrypoint.js) auto-runs on VM start, reads the
          # injected DF_* env, implements, tests, pushes the branch, opens the PR and
          # reports via a GitHub commit status.
          env:
            - name: WORKSPACE
              value: /workspace
            - name: GH_TOKEN_PATH
              value: {{ .Values.secrets.mountPath }}/gh-token
            - name: BIFROST_KEY_PATH
              value: {{ .Values.secrets.mountPath }}/bifrost-api-key
          resources:
            {{- toYaml .Values.coderTemplate.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: gh-token
              mountPath: {{ .Values.secrets.mountPath }}/gh-token
              subPath: gh-token
              readOnly: true
            - name: bifrost-key
              mountPath: {{ .Values.secrets.mountPath }}/bifrost-api-key
              subPath: bifrost-api-key
              readOnly: true

      volumes:
        # emptyDir, so everything the run wrote dies with the sandbox.
        - name: workspace
          emptyDir:
            sizeLimit: {{ .Values.coderTemplate.workspaceSizeLimit | default "20Gi" }}
        # optional: true so the warm pool can start before you create the Secrets;
        # the coder then fails its own auth step with a clear message instead of the
        # pool being stuck Pending and looking like a substrate problem.
        - name: gh-token
          secret:
            secretName: {{ .Values.secrets.githubSecretName }}
            defaultMode: 0400
            optional: true
        - name: bifrost-key
          secret:
            secretName: {{ .Values.secrets.bifrostSecretName }}
            defaultMode: 0400
            optional: true
