# Values for the Kata coder SandboxTemplate + SandboxWarmPool.
#
# Taken from the OAP agent-sandbox chart (the version proven end-to-end on the
# hub) so the templates beside them stay byte-identical to what works. Only two
# things are changed, both because this repo is public and single-cluster:
#   * coderTemplate.image and bifrostUrl are placeholders, injected at deploy time
#     from terraform outputs / a live Service lookup instead of being committed.
#   * warmPool.targetIdle is 1, not 3 — each idle member is a running Kata VM you
#     pay for, and one is enough to demonstrate the pattern.

# Namespace the pool, claims and coder pods live in (agent-sandbox.namespace
# helper). Must match the examples' warmPool.namespace.
namespace: agent-sandbox-system

kata:
  # Default VMM for coder sandboxes. Cloud Hypervisor boots fastest; kata-qemu
  # and kata-fc are also installed by kata/runtimeclasses.
  defaultRuntimeClass: kata-clh
  # Steers the pod onto the Karpenter nested-virt kata pool. Set explicitly here
  # (rather than relying on the RuntimeClass's scheduling block) because that is
  # what the working version does.
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
  tolerations:
    - key: kata
      operator: Equal
      value: "true"
      effect: NoSchedule

coderTemplate:
  # MUST be Overrides, not Allowed. Flow B's SandboxClaim injects BIFROST_URL,
  # which the template ALSO sets — and `Allowed` only lets a claim ADD new env,
  # not replace the template's own. With `Allowed` the claim is rejected with
  # reason=EnvVarsInjectionRejected and df-run fails at its first step.
  envVarsInjectionPolicy: Overrides

  # One Secret at /etc/secrets mode 0400, holding gh-token (+ optional bifrost
  # key). The coder reads them from disk; they are never in env.
  secretsMount:
    enabled: true
    secretName: dark-factory-github

  # PLACEHOLDER — `task kata` injects this from the terraform coder_ecr_urls
  # output. Left obviously invalid so a missing override fails at pull time.
  image: SET-BY-TASK-KATA

  # Warm pods start BEFORE any claim exists, so the coder CANNOT run at boot —
  # it would have no DF_* env. Idle until a claim injects DF_ISSUE_NUMBER, then
  # exec the baked-in entrypoint. Without this the warm pool crash-loops.
  command:
    - /bin/sh
    - -c
    - |
      echo "[sandbox] idle — waiting for a SandboxClaim to inject DF_ISSUE_NUMBER..."
      while [ -z "${DF_ISSUE_NUMBER:-}" ]; do sleep 5; done
      echo "[sandbox] claim injected issue #${DF_ISSUE_NUMBER} — starting coder"
      if [ -f /app/entrypoint.js ]; then exec node /app/entrypoint.js; fi
      echo "[sandbox] no coder entrypoint in this image (placeholder) — idling"; sleep infinity

  workspaceSizeGi: 5
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "2", memory: 4Gi }

  # PLACEHOLDER — injected by `task demo`. A ClusterIP, NOT a service DNS name:
  # a Kata guest's resolver cannot resolve cluster-internal names.
  bifrostUrl: ""

warmPool:
  enabled: true
  name: coder-warmpool
  # The SandboxTemplate idle/claimed sandboxes are cloned from.
  templateName: coder-sandbox
  # 1 warm Kata VM. OAP runs 3; more just means more claims bind instantly.
  targetIdle: 1
