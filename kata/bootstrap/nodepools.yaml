# Karpenter EC2NodeClasses + NodePools that provision nested-virtualization nodes.
# Wave 0: nodes must be provisionable before kata-deploy has anywhere to install.
#
# clusterName and nodeRole come from terraform outputs, substituted by `task kata`
# — they are NOT edited into kata/nodepools/values.yaml. Getting either wrong is a
# silent failure mode: Karpenter creates the NodeClaim, the instance boots, and it
# never joins the cluster (wrong cluster name in userData, or an instance profile
# with no access entry). Nodes just never appear.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kata-nodepools
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ${GITOPS_REPO_URL}
    targetRevision: ${GITOPS_REVISION}
    path: kata/nodepools
    helm:
      releaseName: kata-nodepools
      # Override the placeholders committed in kata/nodepools/values.yaml.
      parameters:
        - name: clusterName
          value: ${DESTINATION_CLUSTER}
        - name: nodeRole
          value: ${KARPENTER_NODE_ROLE}
  destination:
    name: ${DESTINATION_CLUSTER}
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
