# Upstream kata-deploy (OCI chart, pinned) — installs the Kata runtime and
# containerd handlers for QEMU + Cloud Hypervisor, plus the readiness DaemonSet
# that clears the startup taint. Wave 2: runs on the nodes from wave 0.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kata-deploy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/elamaran11/agent-sandbox-blueprints
    targetRevision: main
    path: kata/kata-deploy
  destination:
    name: ${DESTINATION_CLUSTER}
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
