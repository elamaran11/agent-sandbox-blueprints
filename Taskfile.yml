# Agent Sandbox Blueprints — one entry point for the whole blueprint.
#
#   task up          create cluster + platform (terraform, then GitOps addons)
#   task kata        add the Kata micro-VM substrate
#   task lambda      add the AWS Lambda MicroVM substrate
#   task demo-kata   run the Dark Factory on Kata
#   task demo-lambda run the Dark Factory on Lambda MicroVM
#   task down        destroy everything
#
# Every task is idempotent and prints what it is about to do. Nothing here
# reads a secret from the repo — config comes from the gitignored files you
# create in step 1 of the README.
version: "3"

vars:
  TF_DIR: infrastructure/terraform
  GITOPS_DIR: infrastructure/gitops
  # Pinned: AWS Lambda MicroVM is only available in select regions.
  REGION: '{{.REGION | default "us-west-2"}}'

env:
  AWS_REGION: "{{.REGION}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ── Preflight ───────────────────────────────────────────────────────────────
  preflight:
    desc: Verify required CLIs, AWS auth, and that config files exist
    cmds:
      - task: check:tools
      - task: check:aws
      - task: check:config

  check:tools:
    internal: true
    cmds:
      - |
        missing=""
        for t in terraform kubectl aws helm task envsubst; do
          command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
        done
        if [ -n "$missing" ]; then
          echo "ERROR: missing required tools:$missing"; exit 1
        fi
        echo "✓ tools present"

  check:aws:
    internal: true
    cmds:
      - |
        if ! aws sts get-caller-identity >/dev/null 2>&1; then
          echo "ERROR: AWS credentials not configured (aws sts get-caller-identity failed)"; exit 1
        fi
        echo "✓ AWS identity: $(aws sts get-caller-identity --query Arn --output text)"
        echo "✓ region: {{.REGION}}"

  check:config:
    internal: true
    cmds:
      - |
        missing=0
        [ -f "{{.TF_DIR}}/terraform.tfvars" ] || { echo "MISSING {{.TF_DIR}}/terraform.tfvars — copy example.tfvars"; missing=1; }
        [ -f "{{.GITOPS_DIR}}/values.yaml" ]  || { echo "MISSING {{.GITOPS_DIR}}/values.yaml — copy values.example.yaml"; missing=1; }
        [ "$missing" -eq 0 ] || exit 1
        echo "✓ config files present (and gitignored)"

  # ── Platform ────────────────────────────────────────────────────────────────
  up:
    desc: Create the cluster and platform (terraform + GitOps addons)
    cmds:
      - task: preflight
      - task: tf:apply
      - task: kubeconfig
      - task: gitops:bootstrap
      - 'echo "✓ platform ready — next run: task kata and/or task lambda"'

  tf:init:
    desc: terraform init
    dir: "{{.TF_DIR}}"
    cmds:
      - terraform init -upgrade

  tf:plan:
    desc: terraform plan
    dir: "{{.TF_DIR}}"
    cmds:
      - terraform plan -var-file=terraform.tfvars

  tf:apply:
    desc: terraform apply (creates VPC, EKS, Karpenter, Managed ArgoCD/ACK/KRO)
    dir: "{{.TF_DIR}}"
    cmds:
      - terraform init -upgrade
      - terraform apply -var-file=terraform.tfvars -auto-approve

  kubeconfig:
    desc: Write kubeconfig for the new cluster
    dir: "{{.TF_DIR}}"
    cmds:
      - |
        NAME=$(terraform output -raw cluster_name)
        aws eks update-kubeconfig --name "$NAME" --region {{.REGION}}
        kubectl get nodes

  gitops:bootstrap:
    desc: Ensure the ArgoCD platform root Application exists
    cmds:
      # On the default path Terraform already created this Application (so it
      # could inject your gitignored overrides as inline values). Only fall back
      # to the static manifest if it is genuinely missing — e.g. you set
      # enable_managed_argocd=false and installed ArgoCD yourself.
      - |
        if kubectl get application platform-addons -n argocd >/dev/null 2>&1; then
          echo "✓ platform-addons Application already exists (created by terraform)"
        else
          echo "platform-addons not found — applying the self-managed fallback manifest"
          kubectl apply -f {{.GITOPS_DIR}}/bootstrap/
        fi
      - 'echo "✓ platform bootstrapped — watch it reconcile with: task status"'

  status:
    desc: Show ArgoCD application + sandbox status
    cmds:
      - kubectl get applications -A 2>/dev/null || true
      - kubectl get sandboxes,sandboxclaims -A 2>/dev/null || true

  # ── Substrates ──────────────────────────────────────────────────────────────
  kata:
    desc: Add the Kata micro-VM substrate (clh + qemu + fc)
    cmds:
      - task: apply-bootstrap
        vars: { DIR: kata/bootstrap }
      - echo "✓ Kata substrate applied — RuntimeClasses kata-clh, kata-qemu, kata-fc"
      - 'echo "  nodes take ~5 min: Karpenter provisions, then kata-deploy installs the runtime"'

  lambda:
    desc: Add the AWS Lambda MicroVM substrate
    cmds:
      - task: apply-bootstrap
        vars: { DIR: lambda-microvm/bootstrap }
      - echo "✓ Lambda MicroVM substrate applied"

  apply-bootstrap:
    internal: true
    # The bootstrap Applications carry placeholders instead of hardcoded values,
    # so this repo works forked and under any project_name. Everything they need
    # comes from terraform outputs — never from the operator's shell or a
    # hand-edited values file.
    #
    # envsubst is deliberately given an explicit variable list: without it, it
    # would also eat legitimate $-syntax inside the manifests (Argo Workflows
    # templates and container args are full of {{...}} and $VAR).
    dir: "{{.TF_DIR}}"
    cmds:
      - |
        set -euo pipefail
        out() { terraform output -raw "$1"; }
        export DESTINATION_CLUSTER="$(out cluster_name)"
        export KARPENTER_NODE_ROLE="$(out karpenter_node_role)"
        export GITOPS_REPO_URL="$(out gitops_repo_url)"
        export GITOPS_REVISION="$(out gitops_target_revision)"

        echo "  cluster:  $DESTINATION_CLUSTER"
        echo "  nodeRole: $KARPENTER_NODE_ROLE"
        echo "  repo:     $GITOPS_REPO_URL @ $GITOPS_REVISION"

        VARS='$DESTINATION_CLUSTER $KARPENTER_NODE_ROLE $GITOPS_REPO_URL $GITOPS_REVISION'
        for f in ../../{{.DIR}}/*.yaml; do
          envsubst "$VARS" < "$f" | kubectl apply -f -
        done

  # ── Examples ────────────────────────────────────────────────────────────────
  demo-kata:
    desc: Deploy the Dark Factory pipeline on Kata
    cmds:
      - task: demo
        vars: { EXAMPLE: dark-factory-kata }

  demo-lambda:
    desc: Deploy the Dark Factory pipeline on Lambda MicroVM
    cmds:
      - task: demo
        vars: { EXAMPLE: dark-factory-lambda }

  demo:
    internal: true
    # These are Helm charts, not plain manifests — the pipeline templates are
    # heavily parameterized, so they must be rendered before they can be applied.
    #
    # Values arrive in three layers, lowest precedence first:
    #   1. defaults.yaml      committed chart defaults
    #   2. your values.yaml   gitignored: repo, token Secret name, labels, gates
    #   3. --set below        anything account- or cluster-specific
    #
    # Layer 3 exists so NOTHING account-specific is committed. Image URIs, the
    # bifrost address and the Pod Identity binding all differ per deployment; they
    # used to be literals in defaults.yaml, which leaked one account's IDs into a
    # public repo and silently pointed forks at resources they cannot reach.
    cmds:
      - |
        set -euo pipefail
        EX="examples/{{.EXAMPLE}}"
        if [ ! -f "$EX/values.yaml" ]; then
          echo "MISSING $EX/values.yaml"
          echo "  cp $EX/values.example.yaml $EX/values.yaml   # then edit it"
          exit 1
        fi

        TF="{{.TF_DIR}}"
        out() { terraform -chdir="$TF" output -raw "$1" 2>/dev/null || echo ""; }
        CLUSTER="$(out cluster_name)"
        ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"

        # Image URIs from the ECR repos terraform created, at the tag you built.
        ECR_JSON="$(terraform -chdir="$TF" output -json coder_ecr_urls 2>/dev/null || echo '{}')"
        pick() { printf '%s' "$ECR_JSON" | python3 -c "import json,sys;print(json.load(sys.stdin).get('$1',''))"; }
        CODER_REPO="$(pick coder)"
        TAG="{{.IMAGE_TAG | default \"latest\"}}"

        # Bifrost by ClusterIP, not DNS: a Kata guest cannot resolve svc names.
        BIFROST_NS="{{.BIFROST_NS | default \"bifrost\"}}"
        BIFROST_IP="$(kubectl get svc -n "$BIFROST_NS" -l app.kubernetes.io/name=bifrost \
                        -o jsonpath='{.items[0].spec.clusterIP}' 2>/dev/null || echo "")"
        if [ -z "$BIFROST_IP" ]; then
          echo "WARNING: no bifrost Service found in namespace $BIFROST_NS."
          echo "         The coder and the holdout judge will have no LLM gateway."
          echo "         Is the platform synced? Check: task status"
        fi

        SET=""
        add() { [ -n "$2" ] && SET="$SET --set-string $1=$2" || true; }
        add bifrost.url            "${BIFROST_IP:+http://$BIFROST_IP:8080}"
        add holdout.bifrostUrl     "${BIFROST_IP:+http://$BIFROST_IP:8080}"
        add reviewImage            "${CODER_REPO:+$CODER_REPO:$TAG}"
        add holdout.evalImage      "${CODER_REPO:+$CODER_REPO:$TAG}"
        add microvm.podIdentity.clusterName "$CLUSTER"
        add microvm.podIdentity.accountId   "$ACCOUNT"

        echo "  cluster=$CLUSTER account=$ACCOUNT bifrost=${BIFROST_IP:-none} tag=$TAG"

        helm dependency build "$EX" >/dev/null
        # shellcheck disable=SC2086
        helm template {{.EXAMPLE}} "$EX" \
          -f "$EX/defaults.yaml" \
          -f "$EX/values.yaml" \
          $SET \
          | kubectl apply -f -
      - 'echo "✓ pipeline deployed — add the trigger label to a GitHub issue to start a run"'

  # ── Hygiene ─────────────────────────────────────────────────────────────────
  lint:
    desc: Lint terraform, YAML, check for committed secrets and environment leaks
    cmds:
      - task: lint:tf
      - task: lint:secrets
      - task: lint:leaks
      - task: lint:render

  lint:tf:
    desc: terraform fmt + validate
    dir: "{{.TF_DIR}}"
    cmds:
      - terraform fmt -check -recursive
      - terraform init -backend=false -upgrade >/dev/null && terraform validate

  lint:secrets:
    desc: Fail if anything that looks like a credential is tracked by git
    cmds:
      - |
        # Only scan files git actually tracks. Documentation legitimately shows the
        # SHAPE of a credential, so match on a plausible REAL value (a long
        # token/key body) rather than the prefix alone — that way
        # "ghp_your_token_here" and "ghp_..." stay quiet while a genuine leak fires.
        BAD=$(git ls-files -z \
          | xargs -0 grep -nIE \
              -e 'gh[pousr]_[A-Za-z0-9]{36,}' \
              -e 'github_pat_[A-Za-z0-9_]{40,}' \
              -e 'AKIA[0-9A-Z]{16}' \
              -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
              -e 'aws_secret_access_key[[:space:]]*=[[:space:]]*[A-Za-z0-9/+=]{40}' \
            2>/dev/null || true)
        if [ -n "$BAD" ]; then
          echo "✗ possible secret committed:"; echo "$BAD"; exit 1
        fi
        # And make sure the gitignored config files really are ignored.
        for f in infrastructure/terraform/terraform.tfvars infrastructure/gitops/values.yaml \
                 examples/dark-factory-kata/values.yaml examples/dark-factory-lambda/values.yaml; do
          if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
            echo "✗ $f is TRACKED but must be gitignored"; exit 1
          fi
        done
        echo "✓ no secrets tracked"

  lint:leaks:
    desc: Fail if one deployment's account, IPs, or cluster names are committed
    cmds:
      - |
        # This is a public blueprint. Anything account- or cluster-specific must
        # arrive at deploy time (terraform outputs / task demo --set), never as a
        # committed literal — both because it leaks, and because a fork that
        # inherits someone else's IDs fails in confusing ways.
        #
        # Narrow patterns only, so prose in docs and the fixed in-cluster addresses
        # (172.20.0.1 apiserver, service CIDRs) stay quiet.
        #
        # Path and content filters are applied SEPARATELY on purpose. Filtering the
        # whole "path:line:text" string against a placeholder word list means a path
        # containing "example" excludes every hit under examples/ — which is exactly
        # where the deployment-specific values live, so the check silently passed.
        git ls-files -z | xargs -0 grep -nIE \
              -e '[0-9]{12}\.dkr\.ecr\.' \
              -e 'arn:aws:iam::[0-9]{12}:' \
              -e 'arn:aws:sso:::instance/ssoins-[0-9a-f]{16}' \
              -e 'clusterName: (hub|spoke)' \
            2>/dev/null > /tmp/df-leaks.raw || true
        python3 - <<'PY'
        import re, sys

        # Prose may show the shape of these values; code may not carry a real one.
        SKIP_PATHS = ("docs/", "README", "PLAN", "CONTRIBUTING", "SECURITY")
        # Only the matched TEXT is tested for placeholder-ness.
        PLACEHOLDER = re.compile(r"REPLACE|<[A-Za-z_]|your-|YOUR|placeholder|123456789012|ACCOUNT_ID", re.I)

        bad = []
        try:
            lines = open("/tmp/df-leaks.raw").read().splitlines()
        except FileNotFoundError:
            lines = []
        for line in lines:
            parts = line.split(":", 2)
            if len(parts) < 3:
                continue
            path, _, text = parts
            if path.startswith(SKIP_PATHS):
                continue
            if PLACEHOLDER.search(text):
                continue
            bad.append(line)

        if bad:
            print("✗ deployment-specific value committed (use terraform outputs / task demo instead):")
            for b in bad:
                print("   ", b.strip())
            sys.exit(1)
        PY
        echo "✓ no account or cluster identifiers committed"

  lint:render:
    desc: Verify every chart still renders
    cmds:
      - |
        set -uo pipefail
        fail=0
        for ex in dark-factory-kata dark-factory-lambda; do
          helm dependency build "examples/$ex" >/dev/null 2>&1
          N=$(helm template t "examples/$ex" -f "examples/$ex/defaults.yaml" 2>/dev/null | grep -c '^kind:' || true)
          if [ "$N" -lt 20 ]; then
            echo "✗ examples/$ex rendered only $N objects"; fail=1
          else
            echo "✓ examples/$ex renders $N objects"
          fi
        done
        N=$(helm template t infrastructure/gitops/platform 2>/dev/null | grep -c '^kind:' || true)
        if [ "$N" -ge 4 ]; then echo "✓ platform renders $N Applications"; else echo "✗ platform rendered $N"; fail=1; fi
        for c in kata/runtimeclasses kata/nodepools lambda-microvm; do
          if helm template t "$c" >/dev/null 2>&1; then echo "✓ $c renders"; else echo "✗ $c failed to render"; fail=1; fi
        done
        exit $fail

  # ── Teardown ────────────────────────────────────────────────────────────────
  down:
    desc: Destroy everything (sandboxes, substrates, cluster)
    prompt: This destroys the cluster and all sandboxes. Continue?
    cmds:
      - task: down:sandboxes
      - task: tf:destroy

  down:sandboxes:
    internal: true
    cmds:
      # Delete claims first so substrate controllers terminate MicroVMs/pods cleanly
      # instead of leaking them when the cluster goes away.
      - kubectl delete sandboxclaims --all -A --ignore-not-found --timeout=180s || true
      - kubectl delete microvms.lambdamicrovms.services.k8s.aws --all -A --ignore-not-found --timeout=300s || true

  tf:destroy:
    desc: terraform destroy
    dir: "{{.TF_DIR}}"
    cmds:
      - terraform destroy -var-file=terraform.tfvars -auto-approve
