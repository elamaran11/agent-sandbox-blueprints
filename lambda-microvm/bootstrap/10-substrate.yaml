# The Lambda MicroVM substrate itself: KRO graph + platform image, the shim
# bridge SandboxTemplate, the suspend/resume lifecycle controller, and IAM.
#
# Wave 1: needs the ACK CRDs from wave 0, and the Managed KRO + Managed ACK
# capabilities (enabled by terraform) to reconcile the graph's children.
#
# Set microvm.accountId and microvm.codeArtifactUri in values before this can
# build the platform image — see ../README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lambda-microvm-substrate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ${GITOPS_REPO_URL}
    targetRevision: ${GITOPS_REVISION}
    path: lambda-microvm
    helm:
      releaseName: lambda-microvm
      valuesObject:
        microvm:
          enabled: true
          # Every IAM ARN this chart builds is prefixed with this. Left empty it
          # yields "arn:aws:iam:::role/..." and every PodIdentityAssociation fails
          # with "Cross-account pass role is not allowed" — which reads as a trust
          # policy problem rather than a missing account number.
          accountId: "${ACCOUNT_ID}"
          image:
            # DEPLOYMENT-SCOPED, and it matters. This one value names the S3
            # artifact bucket, the build role, the exec role AND the MicrovmImage.
            # A MicrovmImage is account-scoped and this pre-GA ACK controller does
            # NOT honour adoption annotations — it always calls CreateMicrovmImage,
            # so any name already present in the account fails permanently with
            #   ConflictException: The request conflicts with the current state of
            #   the resource
            # (verified: the controller logged CreateMicrovmImage 409 even with
            # adoption-policy set). Uniqueness is the only workable strategy, so
            # key it to the cluster: two clusters in one account, or a re-run
            # beside an older deployment, cannot collide.
            name: ${DESTINATION_CLUSTER}
          podIdentity:
            # From terraform cluster_name. Pod Identity is cluster-scoped, so a wrong
            # name here means the controller silently comes up with no credentials.
            clusterName: ${DESTINATION_CLUSTER}
  destination:
    name: ${DESTINATION_CLUSTER}
    namespace: agent-sandbox-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
